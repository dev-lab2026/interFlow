---
- name: Deploy InterFlow
  hosts: web
  become: true

  vars:
    app_dir: /opt/interflow
    repo_url: "https://github.com/dev-lab2026/interFlow.git"
    repo_branch: main

  roles:
    - docker

  tasks:

    # =========================================================
    # SYSTEM
    # =========================================================

    - name: Fix Azure Ubuntu mirror
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: 'azure.archive.ubuntu.com'
        replace: 'archive.ubuntu.com'

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # =========================================================
    # DOCKER
    # =========================================================

    - name: Ensure Docker is installed
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Ensure Docker is enabled
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Check Docker
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"

    - name: Check Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_version
      changed_when: false

    - name: Display Docker Compose version
      ansible.builtin.debug:
        msg: "{{ compose_version.stdout }}"

    # =========================================================
    # APPLICATION DIRECTORY
    # =========================================================

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # =========================================================
    # ENVIRONMENT
    # =========================================================

    - name: Check production environment file
      ansible.builtin.stat:
        path: "{{ app_dir }}/.env"
      register: env_file

    - name: Fail if .env does not exist
      ansible.builtin.fail:
        msg: >
          /opt/interflow/.env is missing.
          Create the production environment file before deploying.
      when: not env_file.stat.exists

    # =========================================================
    # GIT
    # =========================================================

    - name: Clone/update InterFlow
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true
        update: true

    # =========================================================
    # FILE VALIDATION
    # =========================================================

    - name: Check docker-compose.yml
      ansible.builtin.stat:
        path: "{{ app_dir }}/docker-compose.yml"
      register: compose_file

    - name: Check Dockerfile
      ansible.builtin.stat:
        path: "{{ app_dir }}/Dockerfile"
      register: dockerfile

    - name: Check package.json
      ansible.builtin.stat:
        path: "{{ app_dir }}/package.json"
      register: package_json

    - name: Check bun.lock
      ansible.builtin.stat:
        path: "{{ app_dir }}/bun.lock"
      register: bun_lock

    - name: Validate required files
      ansible.builtin.assert:
        that:
          - compose_file.stat.exists
          - dockerfile.stat.exists
          - package_json.stat.exists
          - bun_lock.stat.exists
        fail_msg: >
          Required files are missing:
          docker-compose.yml, Dockerfile, package.json or bun.lock
        success_msg: "Application files are valid."

    # =========================================================
    # COMPOSE VALIDATION
    # =========================================================

    - name: Validate Docker Compose
      ansible.builtin.command:
        cmd: docker compose config
        chdir: "{{ app_dir }}"
      register: compose_config
      changed_when: false

    # =========================================================
    # DATABASE IMAGE
    # =========================================================

    - name: Pull PostgreSQL
      ansible.builtin.command:
        cmd: docker compose pull postgres
        chdir: "{{ app_dir }}"

    # =========================================================
    # BUILD
    # =========================================================

    - name: Build InterFlow
      ansible.builtin.command:
        cmd: docker compose build --no-cache interflow
        chdir: "{{ app_dir }}"
      register: build_result

    # =========================================================
    # DEPLOY
    # =========================================================

    - name: Start application
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ app_dir }}"

    # =========================================================
    # WAIT
    # =========================================================

    - name: Wait for application startup
      ansible.builtin.pause:
        seconds: 10

    # =========================================================
    # STATUS
    # =========================================================

    - name: Docker Compose status
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_dir }}"
      register: compose_status
      changed_when: false

    - name: Display containers
      ansible.builtin.debug:
        var: compose_status.stdout_lines

    # =========================================================
    # HEALTH CHECK
    # =========================================================

    - name: Check InterFlow health
      ansible.builtin.uri:
        url: http://127.0.0.1/api/health
        method: GET
        status_code: 200
        timeout: 10
      register: health
      retries: 30
      delay: 5
      until: health.status == 200

    # =========================================================
    # SUCCESS
    # =========================================================

    - name: Deployment successful
      ansible.builtin.debug:
        msg:
          - "========================================="
          - " InterFlow DEPLOYMENT SUCCESSFUL"
          - "========================================="
          - "Server: {{ inventory_hostname }}"
          - "Health: HTTP 200"
          - "========================================="