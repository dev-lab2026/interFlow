---
- name: Deploy InterFlow
  hosts: web
  become: true

  roles:
    - docker

  vars:
    app_name: interflow
    app_dir: /opt/interflow
    repository: "https://github.com/dev-lab2026/interFlow.git"
    branch: main

  tasks:

    # ==========================================================
    # SYSTEM
    # ==========================================================

    - name: Fix Azure Ubuntu mirror
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: "azure.archive.ubuntu.com"
        replace: "archive.ubuntu.com"

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade system packages
      ansible.builtin.apt:
        upgrade: dist

    # ==========================================================
    # DOCKER
    # ==========================================================

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"

    - name: Check Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_version
      changed_when: false

    - name: Display Docker Compose version
      ansible.builtin.debug:
        msg: "{{ compose_version.stdout }}"

    - name: Check Docker Buildx
      ansible.builtin.command:
        cmd: docker buildx version
      register: buildx_version
      changed_when: false
      failed_when: false

    - name: Display Buildx status
      ansible.builtin.debug:
        msg: >-
          {{
            buildx_version.stdout
            if buildx_version.rc == 0
            else "Buildx unavailable - using Docker legacy builder"
          }}

    # ==========================================================
    # APPLICATION DIRECTORY
    # ==========================================================

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ==========================================================
    # SOURCE CODE
    # ==========================================================

    - name: Clone InterFlow repository
      ansible.builtin.git:
        repo: "{{ repository }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: true
        update: true

    # ==========================================================
    # VALIDATE APPLICATION FILES
    # ==========================================================

    - name: Check Docker Compose file
      ansible.builtin.stat:
        path: "{{ app_dir }}/docker-compose.yml"
      register: compose_file

    - name: Check Dockerfile
      ansible.builtin.stat:
        path: "{{ app_dir }}/Dockerfile"
      register: dockerfile

    - name: Check package.json
      ansible.builtin.stat:
        path: "{{ app_dir }}/package.json"
      register: package_json

    - name: Check package-lock.json
      ansible.builtin.stat:
        path: "{{ app_dir }}/package-lock.json"
      register: package_lock

    - name: Validate required files
      ansible.builtin.assert:
        that:
          - compose_file.stat.exists
          - dockerfile.stat.exists
          - package_json.stat.exists
          - package_lock.stat.exists
        fail_msg: >
          Required application files are missing.
          Expected docker-compose.yml, Dockerfile,
          package.json and package-lock.json.

    # ==========================================================
    # DOCKER COMPOSE VALIDATION
    # ==========================================================

    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose config
        chdir: "{{ app_dir }}"
      register: compose_config
      changed_when: false

    # ==========================================================
    # DATABASE IMAGE
    # ==========================================================

    - name: Pull PostgreSQL image
      ansible.builtin.command:
        cmd: docker compose pull postgres
        chdir: "{{ app_dir }}"
      changed_when: false

    # ==========================================================
    # BUILD APPLICATION
    # ==========================================================

    - name: Build InterFlow image
      ansible.builtin.command:
        cmd: docker compose build --no-cache interflow
        chdir: "{{ app_dir }}"
      environment:
        DOCKER_BUILDKIT: "0"

    # ==========================================================
    # DEPLOY APPLICATION
    # ==========================================================

    - name: Start InterFlow
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ app_dir }}"

    # ==========================================================
    # CONTAINER STATUS
    # ==========================================================

    - name: Get container status
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_dir }}"
      register: compose_status
      changed_when: false

    - name: Display container status
      ansible.builtin.debug:
        var: compose_status.stdout_lines

    # ==========================================================
    # HEALTH CHECK
    # ==========================================================

    - name: Wait for InterFlow API
      ansible.builtin.uri:
        url: "http://127.0.0.1/api/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 30
      delay: 5
      until: health_check.status == 200

    # ==========================================================
    # SUCCESS
    # ==========================================================

    - name: Deployment completed successfully
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "InterFlow deployment successful"
          - "Server: {{ ansible_host }}"
          - "Application: http://{{ ansible_host }}"
          - "Health: http://{{ ansible_host }}/api/health"
          - "=============================================="