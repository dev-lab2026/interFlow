- hosts: web
  become: yes

  roles:
    - docker

  tasks:

    - name: Clone repository
      git:
        repo: "https://github.com/TON_ORG/interflow.git"
        dest: /opt/interflow
        version: main
        force: yes

    - name: Deploy application
      shell: |
        cd /opt/interflow
        docker compose pull
        docker compose up -d --build
