---
- name: Deploy InterFlow
  hosts: web
  become: true

  roles:
    - docker

  vars:
    app_dir: /opt/interflow
    repository: "https://github.com/dev-lab2026/interFlow.git"
    branch: main

  tasks:

    # ==========================================================
    # SYSTEM
    # ==========================================================

    - name: Fix Azure Ubuntu mirror
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: "azure.archive.ubuntu.com"
        replace: "archive.ubuntu.com"

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade system
      ansible.builtin.apt:
        upgrade: dist

    # ==========================================================
    # DOCKER
    # ==========================================================

    - name: Ensure Docker is running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Check Docker
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"

    - name: Check Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_version
      changed_when: false

    - name: Display Docker Compose version
      ansible.builtin.debug:
        msg: "{{ compose_version.stdout }}"

    # ==========================================================
    # APPLICATION DIRECTORY
    # ==========================================================

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ==========================================================
    # GITHUB
    # ==========================================================

    - name: Clone InterFlow
      ansible.builtin.git:
        repo: "{{ repository }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: true
        update: true

    # ==========================================================
    # VALIDATE FILES
    # ==========================================================

    - name: Check docker-compose.yml
      ansible.builtin.stat:
        path: "{{ app_dir }}/docker-compose.yml"
      register: compose_file

    - name: Check Dockerfile
      ansible.builtin.stat:
        path: "{{ app_dir }}/Dockerfile"
      register: dockerfile

    - name: Check package.json
      ansible.builtin.stat:
        path: "{{ app_dir }}/package.json"
      register: package_json

    - name: Check bun.lock
      ansible.builtin.stat:
        path: "{{ app_dir }}/bun.lock"
      register: bun_lock

    - name: Validate application files
      ansible.builtin.assert:
        that:
          - compose_file.stat.exists
          - dockerfile.stat.exists
          - package_json.stat.exists
          - bun_lock.stat.exists
        fail_msg: >
          Missing required InterFlow files.
          Expected docker-compose.yml, Dockerfile,
          package.json and bun.lock.

    # ==========================================================
    # COMPOSE CONFIG
    # ==========================================================

    - name: Validate Docker Compose
      ansible.builtin.command:
        cmd: docker compose config
        chdir: "{{ app_dir }}"
      changed_when: false

    # ==========================================================
    # PULL POSTGRES
    # ==========================================================

    - name: Pull PostgreSQL
      ansible.builtin.command:
        cmd: docker compose pull postgres
        chdir: "{{ app_dir }}"

    # ==========================================================
    # BUILD
    # ==========================================================

    - name: Build InterFlow
      ansible.builtin.command:
        cmd: docker compose build --no-cache interflow
        chdir: "{{ app_dir }}"

    # ==========================================================
    # DEPLOY
    # ==========================================================

    - name: Start InterFlow
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ app_dir }}"

    # ==========================================================
    # STATUS
    # ==========================================================

    - name: Get container status
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_dir }}"
      register: compose_status
      changed_when: false

    - name: Display container status
      ansible.builtin.debug:
        var: compose_status.stdout_lines

    # ==========================================================
    # HEALTH CHECK
    # ==========================================================

    - name: Wait for InterFlow
      ansible.builtin.uri:
        url: "http://127.0.0.1/api/health"
        method: GET
        status_code: 200
      register: health
      retries: 30
      delay: 5
      until: health.status == 200

    # ==========================================================
    # SUCCESS
    # ==========================================================

    - name: Deployment successful
      ansible.builtin.debug:
        msg: "InterFlow successfully deployed on {{ ansible_host }}"