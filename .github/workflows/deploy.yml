name: Deploy InterFlow

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.AZURE_VM_IP }}" >> ~/.ssh/known_hosts

      - name: Setup Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible

      - name: Install Ansible collection
        run: |
          ansible-galaxy collection install community.general

      - name: Create inventory
        run: |
          mkdir -p ansible

          cat > ansible/inventory.ini <<EOF
          [web]
          ${{ secrets.AZURE_VM_IP }} ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/id_rsa
          EOF

      - name: Test SSH
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            azureuser@${{ secrets.AZURE_VM_IP }} \
            "docker --version"

      - name: Deploy with Ansible
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml