name: Deploy InterFlow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy InterFlow to Azure
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure az cli authenticated as service principal
        shell: bash
        env:
          AZ_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -e
          az account show >/dev/null || az login --service-principal -u "$AZ_CLIENT_ID" -p "$AZ_CLIENT_SECRET" --tenant "$AZ_TENANT_ID"

      - name: Ensure Terraform backend storage exists
        shell: bash
        env:
          AZ_LOCATION: ${{ secrets.AZURE_LOCATION }}
        run: |
          set -e
          LOCATION=${AZ_LOCATION:-swedencentral}
          RG_NAME="rg-tfsstate"
          SA_NAME="stinterflowtfstate01"
          CONTAINER_NAME="tfstate"

          echo "Ensure resource group $RG_NAME in $LOCATION"
          az group create -n "$RG_NAME" -l "$LOCATION" || true

          echo "Ensure storage account $SA_NAME"
          az storage account show -n "$SA_NAME" -g "$RG_NAME" >/dev/null 2>&1 || az storage account create -n "$SA_NAME" -g "$RG_NAME" --sku Standard_LRS --encryption-services blob

          echo "Ensure storage container $CONTAINER_NAME"
          # Get account key
          KEY=$(az storage account keys list -g "$RG_NAME" -n "$SA_NAME" --query [0].value -o tsv)
          az storage container create -n "$CONTAINER_NAME" --account-name "$SA_NAME" --account-key "$KEY" || true

          echo "Export ARM_ACCESS_KEY for Terraform backend authentication"
          echo "ARM_ACCESS_KEY=$KEY" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform init
        working-directory: terraform
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: terraform
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          terraform apply -auto-approve -input=false

      - name: Get public IP from Terraform output
        working-directory: terraform
        id: tfout
        run: |
          IP=$(terraform output -raw public_ip 2>/dev/null || terraform output public_ip)
          echo "AZURE_VM_IP=$IP" >> $GITHUB_ENV

      - name: Configure SSH (install key & known_hosts)
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AZURE_VM_IP: ${{ env.AZURE_VM_IP }}
        run: |
          set -e
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          # Ensure ssh-keygen exists
          ssh-keygen -y -f "$HOME/.ssh/id_rsa" > /dev/null

          # Add host key
          ssh-keyscan -H "$AZURE_VM_IP" >> "$HOME/.ssh/known_hosts" || true
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Wait for SSH to become available
        shell: bash
        env:
          AZURE_VM_IP: ${{ env.AZURE_VM_IP }}
        run: |
          set -e
          echo "Waiting for SSH on $AZURE_VM_IP..."
          for i in {1..30}; do
            ssh -i "$HOME/.ssh/id_rsa" -o StrictHostKeyChecking=no -o ConnectTimeout=5 azureuser@"$AZURE_VM_IP" 'echo ok' && exit 0 || sleep 5
          done
          echo "SSH not available"; exit 1

      - name: Install Ansible (on runner)
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible
          ansible --version

      - name: Create Ansible inventory
        shell: bash
        env:
          AZURE_VM_IP: ${{ env.AZURE_VM_IP }}
        run: |
          mkdir -p ansible
          cat > ansible/inventory.ini <<EOF
          [web]
          ${AZURE_VM_IP} ansible_user=azureuser ansible_python_interpreter=/usr/bin/python3
          EOF
          cat ansible/inventory.ini

      - name: Test Ansible connection (ping)
        shell: bash
        run: |
          ansible -i ansible/inventory.ini web -m ping --private-key="$HOME/.ssh/id_rsa"

      - name: Deploy with Ansible playbook
        shell: bash
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --private-key="$HOME/.ssh/id_rsa"
