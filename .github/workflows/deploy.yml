name: Deploy InterFlow to Azure

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: 'IDENTITY'

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub
          ssh-keygen -lf ~/.ssh/id_rsa.pub

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="public_key=$(cat ~/.ssh/id_rsa.pub)"

      - name: Get Public IP
        working-directory: terraform
        run: |
          echo "PUBLIC_IP=$(terraform output -raw public_ip)" >> $GITHUB_ENV

      - name: Generate Ansible Inventory
        run: |
          cat > ansible/inventory.ini <<EOF
          [web]
          ${PUBLIC_IP} ansible_user=azureuser
          EOF
          cat ansible/inventory.ini

      - name: Wait for SSH
        run: |
          for i in {1..30}; do
            echo "Tentative SSH $i..."
            ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              -i ~/.ssh/id_rsa \
              azureuser@${PUBLIC_IP} exit && break
            sleep 10
          done

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Deploy Application
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            --private-key ~/.ssh/id_rsa \
            ansible/playbook.yml
