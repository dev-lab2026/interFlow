name: Deploy InterFlow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy InterFlow to Azure
    concurrency:
      group: deploy-interflow-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Terraform backend storage exists
        shell: bash
        run: |
          set -e
          RG_NAME="rg-tfstate"
          SA_NAME="stinterflowtfstate2026"
          CONTAINER_NAME="tfstate"

          echo "Ensure resource group $RG_NAME"
          az group create -n "$RG_NAME" -l francecentral || true

          echo "Ensure storage account $SA_NAME"
          az storage account show -n "$SA_NAME" -g "$RG_NAME" >/dev/null 2>&1 || \
            az storage account create -n "$SA_NAME" -g "$RG_NAME" --sku Standard_LRS

          echo "Ensure storage container $CONTAINER_NAME"
          az storage container create \
            --name "$CONTAINER_NAME" \
            --account-name "$SA_NAME" \
            --auth-mode login || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (reconfigure backend)
        working-directory: terraform
        run: terraform init -input=false -reconfigure

      - name: Terraform apply with retry + lease break
        working-directory: terraform
        run: |
          set -euo pipefail

          RETRIES=3
          SA_NAME="stinterflowtfstate2026"
          CONTAINER_NAME="tfstate"
          BLOB_NAME="interflow.tfsstate"

          attempt=1
          while [ $attempt -le $RETRIES ]; do
            echo "Terraform apply attempt $attempt/$RETRIES"

            if terraform apply -auto-approve -input=false -lock-timeout=5m; then
              echo "Terraform apply succeeded"
              exit 0
            fi

            echo "Terraform apply failed on attempt $attempt"

            if [ $attempt -eq $RETRIES ]; then
              echo "Terraform apply failed after $RETRIES attempts"
              exit 1
            fi

            echo "Breaking lease on tfstate blob..."
            az storage blob lease break \
              --account-name "$SA_NAME" \
              --container-name "$CONTAINER_NAME" \
              --blob-name "$BLOB_NAME" \
              --auth-mode login || true

            sleep_time=$((attempt * 10))
            echo "Sleeping ${sleep_time}s before next attempt"
            sleep $sleep_time

            attempt=$((attempt + 1))
          done

      - name: Get public IP from Terraform output
        working-directory: terraform
        id: tfout
        run: |
          IP=$(terraform output -raw public_ip)
          echo "AZURE_VM_IP=$IP" >> $GITHUB_ENV

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AZURE_VM_IP: ${{ env.AZURE_VM_IP }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$AZURE_VM_IP" >> ~/.ssh/known_hosts

      - name: Wait for SSH
        shell: bash
        env:
          AZURE_VM_IP: ${{ env.AZURE_VM_IP }}
        run: |
          set -e
          echo "Waiting for SSH on $AZURE_VM_IP..."
          for i in {1..30}; do
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=5 azureuser@"$AZURE_VM_IP" exit && break
            sleep 10
          done
