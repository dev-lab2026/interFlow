services:
  postgres:
    image: postgres:16-alpine
    container_name: interflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interflow}
      POSTGRES_USER: ${POSTGRES_USER:-interflow}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:?SQL_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interflow} -d ${POSTGRES_DB:-interflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    healthcheck:
      test: ["CMD","wget","--spider","http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - shared_network

  interflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interflow
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 80
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SQL_HOST: interflow-postgres
      SQL_PORT: 5432
      SQL_DB_NAME: ${POSTGRES_DB:-interflow}
      SQL_USER: ${POSTGRES_USER:-interflow}
      SQL_PASSWORD: ${SQL_PASSWORD:?SQL_PASSWORD is required}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?ENTRA_TENANT_ID is required}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?ENTRA_CLIENT_ID is required}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?ENTRA_CLIENT_SECRET is required}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:?ENTRA_REDIRECT_URI is required}
      ENTRA_ADMIN_EMAIL: ${ENTRA_ADMIN_EMAIL:?ENTRA_ADMIN_EMAIL is required}
      ENTRA_POST_LOGOUT_REDIRECT_URI: ${ENTRA_POST_LOGOUT_REDIRECT_URI:-https://interflow.tfsn.duckdns.org/}
    networks:
      - shared_network

volumes:
  postgres_data:

networks:
  shared_network:
    external: false
    name: shared_network
